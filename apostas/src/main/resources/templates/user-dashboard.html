<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard do Usuário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/user-dashboard.css}">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h1 class="text-center">Dashboard do Usuário</h1>

        <!-- Menu de Navegação -->
        <nav class="nav nav-tabs">
            <a class="nav-link active" href="#">Minhas Apostas</a>
            <a class="nav-link" href="/user/apostar">Fazer Aposta</a>
            <a class="nav-link" href="/">Sair</a>
        </nav>

        <h2 class="mt-4">Minhas Apostas</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Partida</th>
                    <th>Data</th>
                    <th>Minha Escolha</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tabelaApostas">
                <tr th:each="aposta : ${apostas}" th:data-id="${aposta.id}">
                    <td th:text="${aposta.partida.timeCasa + ' vs ' + aposta.partida.timeFora}"></td>
                    <td th:text="${#temporals.format(aposta.partida.dataJogo, 'dd/MM/yyyy')}"></td>
                    <td th:text="${aposta.escolha}"></td>
                    <td th:text="${aposta.partida.resultado ?: 'Aguardando'}"></td>
                </tr>
            </tbody>
        </table>

        <script src="/js/user-dashboard.js"></script>
    </div>

</body>
</html>
