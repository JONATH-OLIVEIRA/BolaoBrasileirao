<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center">Cadastro de Usuário</h2>

        <form id="cadastroUsuario" class="p-4 border bg-white rounded">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" name="nome" class="form-control" required pattern=".{3,}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
    <label for="senha" class="form-label">Senha:</label>
 
    <input type="password" id="senha" name="senha" class="form-control" required 
           title="A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma minúscula e um número">
</div>
            
            
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" id="cpf" name="cpf" class="form-control" required pattern="\d{11}">
            </div>
            <div class="mb-3">
                <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>
    </div>

    <script src="/js/cadastro.js"></script>
</body>
</html>
