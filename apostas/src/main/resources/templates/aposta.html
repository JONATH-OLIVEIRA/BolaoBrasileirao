<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fazer Aposta</title>

    <!-- Bootstrap via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/user/dashboard">Meu Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/user/dashboard">Voltar ao Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 p-4 bg-white shadow rounded">
        <h1 class="text-center text-primary">Fazer Aposta</h1>

        <form id="apostaForm" class="mt-4">
            <div class="mb-3" th:each="partida : ${partidas}">
                <h3 class="text-center" th:text="${partida.timeCasa + ' vs ' + partida.timeFora}"></h3>

                <div class="d-flex justify-content-between mt-2">
                    <label class="form-label">
                        <input type="radio" th:name="'aposta_' + ${partida.id}" th:value="CASA_VENCE" required>
                        Apostar no <span th:text="${partida.timeCasa}"></span>
                    </label>

                    <label class="form-label">
                        <input type="radio" th:name="'aposta_' + ${partida.id}" th:value="FORA_VENCE" required>
                        Apostar no <span th:text="${partida.timeFora}"></span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 mt-3">Confirmar Aposta</button>
        </form>
    </div>

    <!-- Bootstrap JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/user-apostar.js}"></script>
</body>
</html>
