<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumo do Administrador</title>

    <!-- Bootstrap via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light" onload="carregarResumo()">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Apostas Brasileirão</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/resumo">Resumo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/partidas">Gerenciar Partidas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/usuarios">Gerenciar Usuários</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo do resumo -->
    <div class="container mt-4">
        <h1 class="text-center mb-4">Resumo do Sistema</h1>

        <!-- Estatísticas gerais -->
        <div class="row">
            <div class="col-md-4">
                <p class="alert alert-primary">Total de Apostas: <span th:text="${dashboard.totalApostas}"></span></p>
            </div>
            <div class="col-md-4">
                <p class="alert alert-success">Total de Partidas: <span th:text="${dashboard.totalPartidas}"></span></p>
            </div>
            <div class="col-md-4">
                <p class="alert alert-warning">Total de Usuários: <span th:text="${dashboard.totalUsuarios}"></span></p>
            </div>
        </div>

        <!-- Gráficos de estatísticas -->
        <div class="row mt-4">
            <div class="col-md-6">
                <h3 class="text-center">Distribuição de Apostas</h3>
                <canvas id="graficoApostas"></canvas>
            </div>
            <div class="col-md-6">
                <h3 class="text-center">Usuários Ativos vs. Inativos</h3>
                <canvas id="graficoUsuarios"></canvas>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS e scripts AJAX -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/resumo.js"></script>
    <script>
        // Função para carregar gráficos
        function carregarResumo() {
            const ctxApostas = document.getElementById('graficoApostas').getContext('2d');
            const ctxUsuarios = document.getElementById('graficoUsuarios').getContext('2d');

            new Chart(ctxApostas, {
                type: 'bar',
                data: {
                    labels: ['Confirmadas', 'Pendentes', 'Canceladas'],
                    datasets: [{
                        label: 'Quantidade de Apostas',
                        data: [50, 30, 20], // 🔹 Substituir por dados reais da API
                        backgroundColor: ['#007bff', '#ffc107', '#dc3545']
                    }]
                }
            });

            new Chart(ctxUsuarios, {
                type: 'pie',
                data: {
                    labels: ['Ativos', 'Inativos'],
                    datasets: [{
                        data: [80, 20], // 🔹 Substituir por dados reais da API
                        backgroundColor: ['#28a745', '#dc3545']
                    }]
                }
            });
        }
    </script>
</body>
</html>
